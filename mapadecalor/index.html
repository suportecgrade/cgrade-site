<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simulador de Preço — Soja | Origem Agro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
:root {
  --bg:       #12110E;
  --panel:    #1A1814;
  --panel-2:  #221F1A;
  --line:     #332F28;
  --line-soft:#26231D;
  --fg:       #EDE6D6;
  --muted:    #A39A88;
  --faint:    #6F675A;
  --gold:     #C9A96A;
  --gold-hi:  #DDBE7E;
  --up:       #86B98F;
  --down:     #D9825F;
  --f-display:"Caladea","Cambria",Georgia,serif;
  --f-body:   "Carlito","Calibri","Segoe UI",system-ui,sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--fg);
  background-image: repeating-linear-gradient(135deg, rgba(201,169,106,.018) 0 2px, transparent 2px 14px);
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-left,0px)) 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
/* ── HEADER ── */
header.brand {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.mark { display: flex; align-items: center; gap: 0; min-width: 0; }
.logo-img {
  height: 72px;
  width: auto;
  flex: none;
  display: block;
}
.titleblock { text-align: right; }
.eyebrow {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(22px, 4vw, 30px);
  margin: 3px 0 0;
}
h1 em { font-style: normal; color: var(--gold); }
/* ── ENTRADAS ── */
.inputs-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 22px;
}
.inputs-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
}
.inputs-grid { display: flex; flex-wrap: wrap; gap: 14px 20px; flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 120px; }
.field label {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.field input {
  background: var(--panel-2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  outline: none;
  -webkit-appearance: none;
  width: 130px;
  max-width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,169,106,.12);
}
.btn-calc {
  background: var(--gold);
  color: #12110E;
  border: none;
  border-radius: 8px;
  padding: 11px 24px;
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  transition: background .15s, transform .08s;
  white-space: nowrap;
}
.btn-calc:hover  { background: var(--gold-hi); }
.btn-calc:active { transform: scale(.97); }
/* ── KPIs ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.kpi { background: var(--panel); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kpi .v {
  font-family: var(--f-display);
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}
.kpi .v.up   { color: var(--up);   }
.kpi .v.down { color: var(--down); }
.kpi .v.gold { color: var(--gold); }
/* ── MAPA ── */
.map-section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 10px;
}
.map-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.legend-row { display: flex; align-items: center; gap: 10px; }
.legend-txt { font-size: 10px; letter-spacing: .08em; color: var(--faint); white-space: nowrap; }
.legend-bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; width: 110px; border: 1px solid var(--line); }
.map-pending {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 40px 20px; font-size: 13px; letter-spacing: .06em; color: var(--faint);
}
.map-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; display: none; }
.map-scroll.show { display: block; }
/* ── TABELA ── */
table { border-collapse: collapse; font-family: var(--f-body); font-variant-numeric: tabular-nums; width: 100%; min-width: 640px; }
thead th {
  background: var(--panel-2); color: var(--muted); font-size: 11px; font-weight: 700;
  letter-spacing: .06em; padding: 8px 10px; text-align: center;
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-soft);
  white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
thead th.col-center { color: var(--gold); background: rgba(201,169,106,0.08); }
thead th.corner { background: var(--panel); color: var(--faint); font-size: 10px; position: sticky; left: 0; z-index: 3; }
tbody td {
  padding: 5px 10px; text-align: center;
  border-right: 1px solid rgba(51,47,40,.55); border-bottom: 1px solid rgba(51,47,40,.55);
  font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--fg);
  cursor: default; transition: filter .1s;
}
tbody td:hover { filter: brightness(1.25); }
tbody td.row-hdr {
  background: var(--panel-2); color: var(--muted); font-size: 11px; font-weight: 700;
  text-align: right; padding: 5px 12px 5px 10px; border-right: 1px solid var(--line);
  position: sticky; left: 0; z-index: 1;
}
tbody td.row-hdr.cr { color: var(--gold); background: rgba(201,169,106,0.07); }
tbody td.active { outline: 2px solid var(--gold); outline-offset: -2px; z-index: 2; position: relative; color: #fff; }
/* ── RODAPÉ ── */
footer {
  border-top: 1px solid var(--line); padding-top: 14px;
  font-size: 11px; color: var(--faint); letter-spacing: .06em;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
}
/* ── RESPONSIVO ── */
@media (max-width: 700px) {
  header.brand { align-items: flex-start; }
  .inputs-top  { flex-direction: column; }
  .field input { width: 100%; }
  .field       { min-width: calc(50% - 8px); }
  .btn-calc    { width: 100%; justify-content: center; }
  .kpis        { grid-template-columns: 1fr; }
  .kpi .v      { font-size: 26px; }
  table        { min-width: 520px; }
  .logo-img    { height: 56px; }
}
@media (max-width: 440px) {
  h1           { font-size: 20px; }
  .field       { min-width: 100%; }
  table        { min-width: 420px; }
  .logo-img    { height: 46px; }
}
</style>
</head>

<div class="inputs-panel">
  <div class="inputs-top">
    <div class="inputs-grid">
      <div class="field"><label>CBOT (¢/bu)</label><input type="number" id="cbot"     value="1285"  step="1"    inputmode="decimal"></div>
      <div class="field"><label>Prêmio (¢/bu)</label><input type="number" id="premio"   value="-20"   step="1"    inputmode="decimal"></div>
      <div class="field"><label>Dólar (R$)</label><input type="number" id="dolar"    value="5.23"  step="0.01" inputmode="decimal"></div>
      <div class="field"><label>Fobbings (USD/sc)</label><input type="number" id="fobbings" value="12"    step="0.5"  inputmode="decimal"></div>
      <div class="field"><label>Frete (R$/t)</label><input type="number" id="frete"    value="0"     step="1"    inputmode="decimal"></div>
    </div>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

<script>
const SC=16.6666,CF=2.20462,CS=20,DS=0.20,H=5,N=H*2+1;
function usd(c,pm,fob,fr,d){return((c+pm)/100*CF)-(fob/SC)-(fr/SC/d);}
function brl(u,d){return u*d;}
function basis(c,u){return(u/CF*100)-c;}
function g(id){return parseFloat(document.getElementById(id).value)||0;}
function colorRG(t){let r,gv,b;if(t<.5){const u=t*2;r=210;gv=Math.round(35+u*125);b=25;}else{const u=(t-.5)*2;r=Math.round(210-u*180);gv=Math.round(160+u*70);b=25;}return`rgba(${r},${gv},${b},0.72)`;}
function calcular(){
  const cbot=g('cbot'),pm=g('premio'),dol=g('dolar'),fob=g('fobbings'),fr=g('frete');
  if(!dol)return;
  const u=usd(cbot,pm,fob,fr,dol),p=brl(u,dol),b=basis(cbot,u);
  sv('r-usd',u.toFixed(2),'v');
  sv('r-brl',p.toFixed(2),'v gold');
  sv('r-basis',Math.round(b),'v '+(b>=0?'up':'down'));
  const cols=Array.from({length:N},(_,i)=>cbot+(H-i)*CS);
  const rows=Array.from({length:N},(_,i)=>+(dol+(H-i)*DS).toFixed(2));
  const mat=rows.map(d=>cols.map(c=>brl(usd(c,pm,fob,fr,d),d)));
  const flat=mat.flat(),mn=Math.min(...flat),mx=Math.max(...flat);
  const tbl=document.getElementById('heatmap');tbl.innerHTML='';
  const hr=tbl.createTHead().insertRow();
  let th=document.createElement('th');th.className='corner';th.textContent='R$/sc';hr.appendChild(th);
  cols.forEach((c,ci)=>{th=document.createElement('th');th.textContent=c;if(ci===H)th.className='col-center';hr.appendChild(th);});
  const tbody=tbl.createTBody();
  rows.forEach((d,ri)=>{
    const tr=tbody.insertRow();
    let td=document.createElement('td');td.textContent=d.toFixed(2);td.className='row-hdr'+(ri===H?' cr':'');tr.appendChild(td);
    cols.forEach((c,ci)=>{
      const v=mat[ri][ci],t=mx===mn?.5:(v-mn)/(mx-mn);
      td=document.createElement('td');td.textContent=v.toFixed(2);td.style.background=colorRG(t);
      if(ri===H&&ci===H)td.classList.add('active');tr.appendChild(td);
    });
  });
  const bar=document.getElementById('legend-bar');bar.innerHTML='';
  for(let i=0;i<32;i++){const s=document.createElement('div');s.style.flex='1';s.style.background=colorRG(i/31);bar.appendChild(s);}
  document.getElementById('map-pending').style.display='none';
  document.getElementById('map-scroll').classList.add('show');
}
function sv(id,val,cls){const el=document.getElementById(id);el.textContent=val;el.className=cls;}
